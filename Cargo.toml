[package]
name = "sutram-xfs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "XFS forensic filesystem parser (v5 CRC inodes/dirs, inobt/finobt deleted-inode recovery, free-space carving)"
keywords = ["forensics", "filesystem", "xfs", "dfir", "carving"]
categories = ["filesystem", "parsing"]

[dependencies]
sutram-io = { path = "../sutram-io", version = "0.1" }
sutram-fs = { path = "../sutram-fs", version = "0.1" }
sutram-magic = { path = "../sutram-magic", version = "0.1" }
