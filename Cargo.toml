[package]
name = "sutram-part"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Android partition-layer parser (sparse images, liblp dynamic partitions, AVB vbmeta, GPT labels)"
keywords = ["forensics", "android", "partitions", "dfir", "vbmeta"]
categories = ["filesystem", "parsing"]

[dependencies]
sutram-io = { path = "../sutram-io", version = "0.1" }
sutram-fs = { path = "../sutram-fs", version = "0.1" }
sutram-magic = { path = "../sutram-magic", version = "0.1" }
