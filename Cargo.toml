[package]
name = "sutram-exfat"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "exFAT forensic filesystem parser (deleted entry sets, orphan chains, allocation-bitmap recovery, magic verdicts)"
keywords = ["forensics", "filesystem", "exfat", "dfir", "carving"]
categories = ["filesystem", "parsing"]

[dependencies]
sutram-io = { path = "../sutram-io", version = "0.1" }
sutram-fs = { path = "../sutram-fs", version = "0.1" }
sutram-magic = { path = "../sutram-magic", version = "0.1" }
